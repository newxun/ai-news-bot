name: Daily AI News Digest

on:
  schedule:
    # 22:37 UTC = 06:37 CST (UTC+8)
    - cron: '37 22 * * *'
  workflow_dispatch: # 支持手动触发测试

permissions:
  contents: write

jobs:
  fetch-and-summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code - AI News Digest
        env:
          # GLM Coding Plan：本任务以抓取+摘要为主，glm-4.7 足够
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.GLM_API_KEY }}
          ANTHROPIC_MODEL: glm-4.7
          ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-4.7
          ANTHROPIC_DEFAULT_SONNET_MODEL: glm-4.7
          ANTHROPIC_DEFAULT_OPUS_MODEL: glm-4.7
        run: |
          claude -p "$(cat prompt.md)" \
            --allowedTools "Bash" \
            --dangerously-skip-permissions \
            --max-turns 30 \
            --no-session-persistence

      - name: Verify digest file
        id: digest
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          DIGEST_FILE="digests/${DATE}.md"

          if [ ! -s output/digest.txt ] && [ -s "$DIGEST_FILE" ]; then
            mkdir -p output
            cp "$DIGEST_FILE" output/digest.txt
          fi

          if [ ! -s output/digest.txt ]; then
            echo "::error::未找到摘要文件（output/digest.txt 或 ${DIGEST_FILE}）"
            exit 1
          fi

          mkdir -p digests
          cp output/digest.txt "$DIGEST_FILE"

          echo "digest_file=$DIGEST_FILE" >> "$GITHUB_OUTPUT"
          echo "digest_date=$DATE" >> "$GITHUB_OUTPUT"
          echo "摘要文件: $DIGEST_FILE ($(wc -c < "$DIGEST_FILE") bytes)"
          head -n 8 "$DIGEST_FILE"

      - name: Commit digest to repository
        env:
          DIGEST_FILE: ${{ steps.digest.outputs.digest_file }}
          DIGEST_DATE: ${{ steps.digest.outputs.digest_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIGEST_FILE"
          if git diff --staged --quiet; then
            echo "日报内容无变化，跳过提交"
          else
            git commit -m "docs: add AI digest ${DIGEST_DATE}"
            git push
            echo "已提交并推送 ${DIGEST_FILE}"
          fi
